# Identity on the OpenChoreo control-plane cluster for the audit forwarder's
# log collector: read the API pods and their logs, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-audit-log-reader
  namespace: openchoreo-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-audit-log-reader
  namespace: openchoreo-control-plane
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-audit-log-reader
  namespace: openchoreo-control-plane
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aep-audit-log-reader}
subjects:
  - {kind: ServiceAccount, name: aep-audit-log-reader, namespace: openchoreo-control-plane}
---
# Long-lived token for the kubeconfig the forwarder mounts; rotate by
# recreating this Secret and the forwarder's kubeconfig Secret.
apiVersion: v1
kind: Secret
metadata:
  name: aep-audit-log-reader
  namespace: openchoreo-control-plane
  annotations:
    kubernetes.io/service-account.name: aep-audit-log-reader
type: kubernetes.io/service-account-token
