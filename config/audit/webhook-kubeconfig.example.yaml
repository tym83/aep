apiVersion: v1
kind: Config
clusters:
  - name: audit
    cluster:
      server: https://aep-audit.aep-system.svc/kubernetes
      certificate-authority: /etc/aep-audit/ca.crt
users:
  - name: audit
    user:
      tokenFile: /etc/aep-audit/token
contexts:
  - name: audit
    context: {cluster: audit, user: audit}
current-context: audit
