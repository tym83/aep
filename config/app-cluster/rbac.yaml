apiVersion: v1
kind: Namespace
metadata:
  name: aep-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-bridge
  namespace: aep-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aep-bridge
rules:
  - apiGroups: [aep.aenix.io]
    resources: [serviceclaims, serviceclaims/status, serviceclaims/finalizers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, create, patch, update]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-bridge
subjects:
  - kind: ServiceAccount
    name: aep-bridge
    namespace: aep-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aep-openchoreo-agent
rules:
  - apiGroups: [aep.aenix.io]
    resources: [serviceclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-openchoreo-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-openchoreo-agent
subjects:
  - kind: ServiceAccount
    name: cluster-agent-dataplane
    namespace: openchoreo-data-plane
