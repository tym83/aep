apiVersion: v1
kind: Namespace
metadata:
  name: aep-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-bridge
  namespace: aep-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aep-bridge
rules:
  - apiGroups: [aep.aenix.io]
    resources: [serviceclaims, serviceclaims/status, serviceclaims/finalizers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, create, patch, update]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-bridge
subjects:
  - kind: ServiceAccount
    name: aep-bridge
    namespace: aep-system
---
# Kafka claims are Strimzi resources in this namespace only; Strimzi writes
# the user and cluster CA Secrets the bridge reads into claim outputs.
apiVersion: v1
kind: Namespace
metadata:
  name: aep-kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-bridge-kafka
  namespace: aep-kafka
rules:
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas, kafkanodepools, kafkatopics, kafkausers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-bridge-kafka
  namespace: aep-kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aep-bridge-kafka
subjects:
  - kind: ServiceAccount
    name: aep-bridge
    namespace: aep-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aep-openchoreo-agent
rules:
  - apiGroups: [aep.aenix.io]
    resources: [serviceclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-openchoreo-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-openchoreo-agent
subjects:
  - kind: ServiceAccount
    name: cluster-agent-dataplane
    namespace: openchoreo-data-plane
