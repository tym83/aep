{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "ratecards.aep.aenix.io"
  },
  "spec": {
    "group": "aep.aenix.io",
    "scope": "Cluster",
    "names": {
      "plural": "ratecards",
      "singular": "ratecard",
      "kind": "RateCard"
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "required": [
                  "effectiveFrom",
                  "currency",
                  "vcpuHour",
                  "memoryGiBHour",
                  "storageGiBMonth",
                  "externalIPMonth",
                  "bucketGiBMonth"
                ],
                "properties": {
                  "effectiveFrom": {
                    "type": "string",
                    "format": "date-time"
                  },
                  "currency": {
                    "type": "string",
                    "pattern": "^[A-Z]{3}$"
                  },
                  "vcpuHour": {
                    "type": "number",
                    "minimum": 0
                  },
                  "memoryGiBHour": {
                    "type": "number",
                    "minimum": 0
                  },
                  "externalIPMonth": {
                    "type": "number",
                    "minimum": 0
                  },
                  "bucketGiBMonth": {
                    "type": "number",
                    "minimum": 0
                  },
                  "storageGiBMonth": {
                    "type": "object",
                    "additionalProperties": {
                      "type": "number",
                      "minimum": 0
                    }
                  },
                  "gpuHour": {
                    "type": "object",
                    "additionalProperties": {
                      "type": "number",
                      "minimum": 0
                    }
                  },
                  "shared": {
                    "type": "object",
                    "properties": {
                      "management": {
                        "type": "object",
                        "required": [
                          "monthly",
                          "allocationKey"
                        ],
                        "properties": {
                          "monthly": {
                            "type": "number",
                            "minimum": 0
                          },
                          "allocationKey": {
                            "type": "string",
                            "enum": [
                              "equal",
                              "resourceShare"
                            ]
                          }
                        }
                      },
                      "aep-cp": {
                        "type": "object",
                        "required": [
                          "monthly",
                          "allocationKey"
                        ],
                        "properties": {
                          "monthly": {
                            "type": "number",
                            "minimum": 0
                          },
                          "allocationKey": {
                            "type": "string",
                            "enum": [
                              "equal",
                              "resourceShare"
                            ]
                          }
                        }
                      },
                      "opensearch": {
                        "type": "object",
                        "required": [
                          "monthly",
                          "allocationKey"
                        ],
                        "properties": {
                          "monthly": {
                            "type": "number",
                            "minimum": 0
                          },
                          "allocationKey": {
                            "type": "string",
                            "enum": [
                              "equal",
                              "resourceShare"
                            ]
                          }
                        }
                      },
                      "harbor": {
                        "type": "object",
                        "required": [
                          "monthly",
                          "allocationKey"
                        ],
                        "properties": {
                          "monthly": {
                            "type": "number",
                            "minimum": 0
                          },
                          "allocationKey": {
                            "type": "string",
                            "enum": [
                              "equal",
                              "resourceShare"
                            ]
                          }
                        }
                      }
                    }
                  }
                },
                "x-kubernetes-validations": [
                  {
                    "rule": "self == oldSelf",
                    "message": "Rate versions are immutable; create a new RateCard"
                  }
                ]
              }
            }
          }
        }
      }
    ]
  }
}
