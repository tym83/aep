apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-bridge
  namespace: tenant-aepdev-nonprod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-bridge
  namespace: tenant-aepdev-nonprod
rules:
  - apiGroups: [apps.cozystack.io]
    resources: [postgreses, redises]
    verbs: ["*"]
  - apiGroups: [core.cozystack.io]
    resources: [tenantsecrets]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [backups.cozystack.io]
    resources: [plans]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [backups.cozystack.io]
    resources: [backups]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-bridge
  namespace: tenant-aepdev-nonprod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aep-bridge
subjects:
  - kind: ServiceAccount
    name: aep-bridge
    namespace: tenant-aepdev-nonprod
