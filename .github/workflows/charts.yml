name: charts
on:
  push:
    branches: [main]
    paths: ["policies/**", "charts/**", "internal/release/**", "cmd/aep-release/**", ".github/workflows/charts.yml"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.3
      - name: Publish exact release chart layouts
        run: |
          mkdir -p dist
          go run ./cmd/aep-release publish-charts --chart-registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aep" > dist/chart-refs
      - name: Sign published chart digests
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            while IFS= read -r ref; do
              cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$ref"
            done < dist/chart-refs
          fi
