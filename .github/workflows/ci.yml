name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Flag registration happens at start-up, outside unit tests: catch
      # duplicate flags and init panics in every shipped binary.
      - name: Binaries start
        run: |
          go build -o bin/ ./cmd/...
          for b in bin/*; do
            out=$("$b" -h 2>&1 || true)
            if grep -q "^panic: " <<<"$out"; then echo "$b: $out"; exit 1; fi
          done
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make charts-lint
      - run: go test ./internal/manifests
