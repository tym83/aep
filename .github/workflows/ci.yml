name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: helm dependency build charts/aep-gitlab
      - name: Stage fleet charts for permission coverage
        run: sh charts/aep-operator/fleet-stage.sh "$RUNNER_TEMP/fleet-charts"
      - run: go test ./...
        env:
          AEP_FLEET_CHART_TEST_DIR: ${{ runner.temp }}/fleet-charts
      # Flag registration happens at start-up, outside unit tests: catch
      # duplicate flags and init panics in every shipped binary.
      - name: Binaries start
        run: |
          go build -o bin/ ./cmd/...
          for b in bin/*; do
            out=$("$b" -h 2>&1 || true)
            if grep -q "^panic: " <<<"$out"; then echo "$b: $out"; exit 1; fi
          done
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash tools/check-argocd.sh
      - run: helm dependency build charts/aep-gitlab
      - run: make charts-lint
      - run: go test ./internal/manifests ./charts

  airgap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Fetch pinned upstream charts for mirror rendering
        run: |
          mkdir -p release/.cache
          helm pull klusterlet --repo https://open-cluster-management.io/helm-charts --version 1.4.0 --untar --untardir release/.cache
          helm pull gitlab --repo https://charts.gitlab.io --version 10.6.2 --destination release/.cache
          mkdir -p charts/aep-gitlab/charts
          cp release/.cache/gitlab-10.6.2.tgz charts/aep-gitlab/charts/
          helm pull argo-cd --repo https://argoproj.github.io/argo-helm --version 9.7.1 --untar --untardir release/.cache
          helm pull oci://ghcr.io/kyverno/charts/kyverno --version 3.9.2 --untar --untardir release/.cache
          helm pull oci://cr.kgateway.dev/kgateway-dev/charts/kgateway --version v2.3.11 --untar --untardir release/.cache
          helm pull oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds --version v2.3.11 --untar --untardir release/.cache
          helm pull oci://cr.openchoreo.dev/openchoreo/helm-charts/openchoreo-data-plane --version 1.4.0-m.3 --untar --untardir release/.cache
      - name: Check immutable release inventory offline
        run: go run ./cmd/aep-release manifest --check
      - name: Verify mirrored manifests and disconnected transfer
        env:
          AEP_UPSTREAM_CHARTS: ${{ github.workspace }}/release/.cache
        run: go test ./internal/operator ./internal/release ./internal/registrymirror ./charts
