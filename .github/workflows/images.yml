name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: aep-audit-forwarder
            dockerfile: Dockerfile.audit-forwarder
          - name: aep-cp-backup
            dockerfile: Dockerfile.cp-backup
          - name: aep-portal
            dockerfile: portal/Dockerfile
          - name: aep-bridge
            dockerfile: Dockerfile
          - name: aep-operator
            dockerfile: Dockerfile.operator
          - name: aep-cost-ledger
            dockerfile: Dockerfile.cost-ledger
          - name: aep-read-api
            dockerfile: Dockerfile.read-api
          - name: aep-change-api
            dockerfile: Dockerfile.change-api
          - name: aep-change-controller
            dockerfile: Dockerfile.change-controller
          - name: aep-cozystack-mcp
            dockerfile: Dockerfile.cozystack-mcp
          - name: aep-token-proxy
            dockerfile: Dockerfile.token-proxy
          - name: aep-alert-router
            dockerfile: Dockerfile.alert-router
          - name: aep-rca-eval
            dockerfile: Dockerfile.rca-eval
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
