name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
# Tenant service image inventory, pinned alongside Argo CD chart 9.7.1.
env:
  ARGOCD_IMAGE: quay.io/argoproj/argocd:v3.4.4
  ARGOCD_REDIS_IMAGE: ecr-public.aws.com/docker/library/redis:8.2.3-alpine
jobs:
  verify-tenant-images:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker buildx imagetools inspect "$ARGOCD_IMAGE"
          docker buildx imagetools inspect "$ARGOCD_REDIS_IMAGE"
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: aep-audit-forwarder
            dockerfile: Dockerfile.audit-forwarder
          - name: aep-cp-backup
            dockerfile: Dockerfile.cp-backup
          - name: aep-portal
            dockerfile: portal/Dockerfile
          - name: aep-bridge
            dockerfile: Dockerfile
          - name: aep-operator
            dockerfile: Dockerfile.operator
          - name: aep-cost-ledger
            dockerfile: Dockerfile.cost-ledger
          - name: aep-read-api
            dockerfile: Dockerfile.read-api
          - name: aep-itsm-bridge
            dockerfile: Dockerfile.itsm-bridge
          - name: aep-change-api
            dockerfile: Dockerfile.change-api
          - name: aep-change-controller
            dockerfile: Dockerfile.change-controller
          - name: aep-cozystack-mcp
            dockerfile: Dockerfile.cozystack-mcp
          - name: aep-token-proxy
            dockerfile: Dockerfile.token-proxy
          - name: aep-alert-router
            dockerfile: Dockerfile.alert-router
          - name: aep-rca-eval
            dockerfile: Dockerfile.rca-eval
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long,enable=${{ github.ref_type != 'tag' }}
            type=ref,event=tag
      - name: Select operator build version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: AEP_VERSION=${{ steps.version.outputs.value }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.3
      - name: Sign published image digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "${IMAGE,,}@$DIGEST"
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin release images and package release charts
        run: |
          go run ./cmd/aep-release manifest --build-version "$GITHUB_REF_NAME"
          mkdir -p dist
          go run ./cmd/aep-release publish-charts > dist/chart-refs
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.3
      - name: Sign release chart digests
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            while IFS= read -r ref; do
              cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$ref"
            done < dist/chart-refs
          fi
      - name: Record published signatures
        run: go run ./cmd/aep-release manifest --refresh-local --discover-signatures
      - uses: actions/upload-artifact@v4
        with:
          name: aep-release-${{ github.ref_name }}
          path: |
            release/manifest.yaml
            release/artifacts/
            charts/
