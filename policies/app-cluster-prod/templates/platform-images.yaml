{{- $trust := .Values.platformImageTrust -}}
{{- $mode := default "audit" $trust.mode -}}
{{- if not (has $mode (list "audit" "enforce")) -}}
{{- fail "platformImageTrust.mode must be audit or enforce" -}}
{{- end -}}
{{- $enforce := and (eq $mode "enforce") (or $trust.vendorPublicKeys $trust.allowedImages) -}}
{{- range $trust.vendorPublicKeys -}}
{{- if not (trim .) -}}{{- fail "vendorPublicKeys must not be blank" -}}{{- end -}}
{{- end -}}
{{- range $trust.allowedImages -}}
{{- if not (regexMatch "^[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$" .) -}}
{{- fail "platformImageTrust.allowedImages must be exact registry/repository@sha256:digest references" -}}
{{- end -}}
{{- end }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aep-platform-images
spec:
  validationFailureAction: {{ if $enforce }}Enforce{{ else }}Audit{{ end }}
  failurePolicy: {{ if $enforce }}Fail{{ else }}Ignore{{ end }}
  background: true
  rules:
    - name: platform-trust
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
{{ include "aep.platformNamespaces" . | indent 16 }}
{{- if $trust.vendorPublicKeys }}
      verifyImages:
        - imageReferences: ["*"]
          skipImageReferences: {{ $trust.allowedImages | default list | toJson }}
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
{{- range $trust.vendorPublicKeys }}
                - keys:
                    publicKeys: {{ . | quote }}
                    rekor:
                      ignoreTlog: true
{{- end }}
{{- else }}
      validate:
        message: Platform images must be explicitly trusted by registry/repository and digest.
        foreach:
          - list: request.object.spec.[containers, initContainers, ephemeralContainers][]
            deny:
              conditions:
                all:
                  - key: {{ "{{ element.image }}" | quote }}
                    operator: AnyNotIn
                    value: {{ $trust.allowedImages | default list | toJson }}
{{- end }}
