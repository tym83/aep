apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: aep-restricted
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restricted
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, "cozy-*", "openchoreo-*", kyverno, aep-system]
      validate:
        message: Nonproduction workloads must satisfy restricted Pod Security.
        podSecurity:
          level: restricted
          version: latest
