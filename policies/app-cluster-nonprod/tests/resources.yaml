        }
      }
    ]
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "build",
    "namespace": "workflows-acme"
  },
  "spec": {
    "containers": [
      {
        "name": "main",
        "image": "gcr.io/kaniko-project/executor:v1.23.2",
        "securityContext": {
          "allowPrivilegeEscalation": false
        },
        "resources": {
          "limits": {
            "cpu": "2",
            "memory": "4Gi"
          }
        }
      }
    ]
  }
}
---
