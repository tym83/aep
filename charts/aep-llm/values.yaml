image: vllm/vllm-openai:v0.11.0
model: ""
gpu: 1
weights:
  size: 100Gi
  storageClass: ""
  existingClaim: ""
resources:
  cpu: "4"
  memory: 16Gi
# Required existing Secret with key api-key; pass the same key to the agent.
apiKeySecret: ""
extraArgs: []

allowUnauthenticated: false
networkPolicy:
  allowedSources:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: aep-sre-agent
