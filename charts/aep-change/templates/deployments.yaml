{{- range $component := list "api" "controller" }}
{{- $settings := index $.Values $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  replicas: {{ $settings.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/component: change-{{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name | quote }}
        app.kubernetes.io/component: change-{{ $component }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $component }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: change-{{ $component }}
          image: {{ include "aep.mirror" (dict "root" $ "ref" (printf "%s:%s%s" $settings.repository $.Values.image.tag (ternary (printf "@%s" $settings.digest) "" (ne ($settings.digest | default "") "")))) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - {{ printf "--org-namespace-template=%s" $.Values.orgNamespaceTemplate | quote }}
            {{- if eq $component "api" }}
            - --listen=:8080
            - {{ printf "--issuer=%s" (required "oidc.issuer is required" $.Values.oidc.issuer) | quote }}
            - {{ printf "--audience=%s" (required "oidc.audience is required" $.Values.oidc.audience) | quote }}
            - {{ printf "--jwks-url=%s" $.Values.oidc.jwksUrl | quote }}
            - {{ printf "--username-claim=%s" $.Values.oidc.usernameClaim | quote }}
            - {{ printf "--groups-claim=%s" $.Values.oidc.groupsClaim | quote }}
            {{- if $.Values.api.tlsSecret }}
            - --tls-cert=/etc/aep/tls/tls.crt
            - --tls-key=/etc/aep/tls/tls.key
            {{- end }}
            {{- else }}
            - {{ printf "--oc-api-url=%s" (required "openchoreo.apiUrl is required" $.Values.openchoreo.apiUrl) | quote }}
            - {{ printf "--oc-token-url=%s" $.Values.openchoreo.tokenUrl | quote }}
            - {{ printf "--oc-client-id-template=%s" $.Values.openchoreo.clientIdTemplate | quote }}
            - {{ printf "--oc-secret-name=%s" $.Values.openchoreo.secretNameTemplate | quote }}
            - {{ printf "--leader-election-namespace=%s" ($.Values.controller.leaseNamespace | default $.Release.Namespace) | quote }}
            - {{ printf "--approval-ttl=%s" $.Values.controller.approvalTTL | quote }}
            - {{ printf "--max-attempts=%v" $.Values.controller.maxAttempts | quote }}
            {{- if $.Values.controller.policyConfigMap }}
            - --policy-config=/etc/aep/policy/policy.yaml
            {{- end }}
            {{- end }}
          {{- if $.Values.caBundleConfigMap }}
          env:
            - name: SSL_CERT_FILE
              value: /etc/aep/ca/ca.crt
          {{- end }}
          ports:
            - {name: http, containerPort: {{ if eq $component "api" }}8080{{ else }}8081{{ end }}}
          readinessProbe:
            {{- if eq $component "api" }}
            tcpSocket: {port: http}
            {{- else }}
            httpGet: {path: /readyz, port: http}
            {{- end }}
          livenessProbe:
            {{- if eq $component "api" }}
            tcpSocket: {port: http}
            {{- else }}
            httpGet: {path: /healthz, port: http}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            {{- if $.Values.caBundleConfigMap }}
            - {name: ca, mountPath: /etc/aep/ca, readOnly: true}
            {{- end }}
            {{- if and (eq $component "api") $.Values.api.tlsSecret }}
            - {name: tls, mountPath: /etc/aep/tls, readOnly: true}
            {{- end }}
            {{- if and (eq $component "controller") $.Values.controller.policyConfigMap }}
            - {name: policy, mountPath: /etc/aep/policy, readOnly: true}
            {{- end }}
      volumes:
        {{- if $.Values.caBundleConfigMap }}
        - name: ca
          configMap:
            name: {{ $.Values.caBundleConfigMap | quote }}
        {{- end }}
        {{- if and (eq $component "api") $.Values.api.tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $.Values.api.tlsSecret | quote }}
        {{- end }}
        {{- if and (eq $component "controller") $.Values.controller.policyConfigMap }}
        - name: policy
          configMap:
            name: {{ $.Values.controller.policyConfigMap | quote }}
        {{- end }}
{{- end }}
