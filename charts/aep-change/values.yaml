image:
  tag: ""
  pullPolicy: IfNotPresent
api:
  repository: ghcr.io/tym83/aep-change-api
  digest: ""
  replicas: 1
  # Existing kubernetes.io/tls Secret in the release namespace; empty serves HTTP.
  tlsSecret: ""
controller:
  repository: ghcr.io/tym83/aep-change-controller
  digest: ""
  replicas: 1
  # Empty uses the release namespace. The namespace must already exist.
  leaseNamespace: ""
  approvalTTL: 72h
  maxAttempts: 8
  # Existing ConfigMap in the release namespace, key policy.yaml.
  policyConfigMap: ""
oidc:
  issuer: ""
  jwksUrl: ""
  audience: ""
  usernameClaim: preferred_username
  groupsClaim: groups
openchoreo:
  apiUrl: ""
  tokenUrl: ""
  clientIdTemplate: aep-change-{org}
  secretNameTemplate: aep-change-{org}
orgNamespaceTemplate: tenant-{org}
# Required organization names. RBAC namespaces and Secret names are derived from
# the templates above. Namespaces and credential Secrets must already exist.
organizations: []
# Optional ConfigMap with ca.crt (PEM bundle), mounted in both pods.
# Include all required public/private roots when overriding the system bundle.
caBundleConfigMap: ""
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  clusterIssuer: ""
  annotations: {}

# Mirror prefix; upstream registry hosts are retained as path components.
global:
  aepVersion: ""
  aepDigests: {}
  imageRegistry: ""
  # Secrets to pull AEP images from a private registry mirror.
  imagePullSecrets: []
