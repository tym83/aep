image:
  repository: ghcr.io/tym83/aep-itsm-bridge
  # Required: use the digest produced by the image workflow. No image is published by this branch.
  digest: ""
  pullPolicy: IfNotPresent
# Existing Secret with ITSM_HMAC_SECRET, AEP_CLIENT_SECRET and vendor credentials:
# ITSM_CLIENT_SECRET for ServiceNow; ITSM_TOKEN for Jira.
credentialsSecret: ""
config:
  organization: ""
  changeNamespace: ""
  adapter: servicenow
  vendorUrl: ""
  tokenUrl: ""
  clientId: ""
  aepUrl: ""
  aepTokenUrl: ""
  aepClientId: ""
  confirmationUrl: ""
  syncCmdb: true
  services: []
  jiraProject: ""
  jiraServiceDesk: ""
  jiraRequestType: ""
  jiraTransitions: {}
pollInterval: 15s
# Existing TLS Secret. With no Secret, terminate TLS on a trusted private gateway.
tlsSecret: ""
caBundleConfigMap: ""
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}
