image:
  repository: ghcr.io/tym83/aep-itsm-bridge
  digest: ""
  pullPolicy: IfNotPresent
# Existing Secret with ITSM_INBOUND_HMAC_SECRET and ITSM_INBOUND_HMAC_KEY_ID, AEP_CLIENT_SECRET and vendor credentials:
# ITSM_CLIENT_SECRET for ServiceNow; ITSM_TOKEN for Jira.
credentialsSecret: ""
config:
  organization: ""
  changeNamespace: ""
  adapter: servicenow
  vendorUrl: ""
  tokenUrl: ""
  clientId: ""
  aepUrl: ""
  aepTokenUrl: ""
  aepClientId: ""
  confirmationUrl: ""
  # null selects true for ServiceNow and false for Jira/webhook.
  syncCmdb: null
  # RFC3339 time; changes created earlier are not mirrored. Set it to the
  # moment the integration is enabled, or the bridge mirrors the whole history.
  mirrorSince: ""
  standardTemplate: ""
  # ServiceNow sys_id of the group owning mirrored changes; normal changes
  # cannot leave New without an assignment group.
  assignmentGroup: ""
  companySysId: ""
  jiraEmail: ""
  services: []
  jiraProject: ""
  jiraServiceDesk: ""
  jiraRequestType: ""
  jiraTransitions: {}
  # Workflow statuses that record a CAB decision, by status ID (names are localized
  # per reader) or name, e.g. {approve: ["10012"], reject: ["10013"]}.
  # Transitions into them become approval evidence notes; JSM approval steps always do.
  jiraDecisionStatuses: {}
tiers: []
pollInterval: 15s
# Existing TLS Secret. With no Secret, terminate TLS on a trusted private gateway.
tlsSecret: ""
caBundleConfigMap: ""
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

# Mirror prefix; upstream registry hosts are retained as path components.
global:
  aepVersion: ""
  aepDigests: {}
  imageRegistry: ""
  # Secrets to pull AEP images from a private registry mirror.
  imagePullSecrets: []
