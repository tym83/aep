{{- if .Values.types.service }}
{{- range $scope := include "aep.componentTypeScopes" . | fromYamlArray }}
---
apiVersion: openchoreo.dev/v1alpha1
kind: {{ $scope.kind }}
metadata:
{{- with $scope.namespace }}
  namespace: {{ . }}
{{- end }}
  annotations:
    openchoreo.dev/description: AEP restricted-compliant request-serving service
    openchoreo.dev/legacy-endpoints: "true"
  name: aep-service
spec:
  allowedTraits:
  - kind: ClusterTrait
    name: health-probes
  - kind: ClusterTrait
    name: horizontal-pod-autoscaler
  - kind: ClusterTrait
    name: observability-alert-rule
  - kind: ClusterTrait
    name: persistent-volume-claim
  - kind: ClusterTrait
    name: vertical-pod-autoscaler
  allowedWorkflows:{{ include "aep.allowedWorkflows" (dict "root" $ "scope" $scope) }}
  environmentConfigs:
    openAPIV3Schema:
      properties:
        imagePullPolicy:
          default: IfNotPresent
          enum:
          - Always
          - IfNotPresent
          - Never
          type: string
        imagePullSecrets:
          default: []
          items:
            type: string
          type: array
        readOnlyRootFilesystem:
          default: true
          type: boolean
        replicas:
          default: 1
          minimum: 0
          type: integer
        resources:
          default: {}
          properties:
            limits:
              default: {}
              properties:
                cpu:
                  default: {{ required "resources.limits.cpu is required" $.Values.resources.limits.cpu | quote }}
                  minLength: 1
                  type: string
                memory:
                  default: {{ required "resources.limits.memory is required" $.Values.resources.limits.memory | quote }}
                  minLength: 1
                  type: string
              type: object
            requests:
              default: {}
              properties:
                cpu:
                  default: {{ required "resources.requests.cpu is required" $.Values.resources.requests.cpu | quote }}
                  minLength: 1
                  type: string
                memory:
                  default: {{ required "resources.requests.memory is required" $.Values.resources.requests.memory | quote }}
                  minLength: 1
                  type: string
              type: object
          type: object
        runAsUser:
          default: 65532
          minimum: 1
          type: integer
      type: object
  resources:
  - id: serviceaccount
    targetPlane: dataplane
    template:
      apiVersion: v1
      automountServiceAccountToken: false
      imagePullSecrets: |
        ${size(environmentConfigs.imagePullSecrets) > 0 ? environmentConfigs.imagePullSecrets.map(n, {"name": n}) : oc_omit()}
      kind: ServiceAccount
      metadata:
        labels: ${metadata.labels}
        name: ${metadata.name}
        namespace: ${metadata.namespace}
  - id: deployment
    targetPlane: dataplane
    template:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels: ${metadata.labels}
        name: ${metadata.name}
        namespace: ${metadata.namespace}
      spec:
        replicas: ${environmentConfigs.replicas}
        selector:
          matchLabels: ${metadata.podSelectors}
        template:
          metadata:
            labels: ${metadata.podSelectors}
          spec:
            automountServiceAccountToken: false
            containers:
            - args: |
                ${has(workload.container.args) ? workload.container.args : oc_omit()}
              command: |
                ${has(workload.container.command) ? workload.container.command : oc_omit()}
              env: ${dependencies.toContainerEnvs()}
              envFrom: ${configurations.toContainerEnvFrom()}
              image: ${workload.container.image}
              imagePullPolicy: ${environmentConfigs.imagePullPolicy}
              name: main
              resources:
                limits:
                  cpu: ${environmentConfigs.resources.limits.cpu}
                  memory: ${environmentConfigs.resources.limits.memory}
                requests:
                  cpu: ${environmentConfigs.resources.requests.cpu}
                  memory: ${environmentConfigs.resources.requests.memory}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: ${environmentConfigs.readOnlyRootFilesystem}
              volumeMounts: '${dyn(configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts())
                + [{"name": "aep-tmp", "mountPath": "/tmp"}]}'
            securityContext:
              runAsNonRoot: true
              runAsUser: ${environmentConfigs.runAsUser}
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: ${metadata.name}
            volumes: '${dyn(configurations.toVolumes() + dependencies.toVolumes()) + [{"name":
              "aep-tmp", "emptyDir": {}}]}'
  - id: service
    includeWhen: ${size(workload.endpoints) > 0}
    targetPlane: dataplane
    template:
      apiVersion: v1
      kind: Service
      metadata:
        labels: ${metadata.labels}
        name: '${metadata.releaseLineName == "" ? metadata.componentName : metadata.componentLineName}'
        namespace: ${metadata.namespace}
      spec:
        ports: ${workload.toServicePorts()}
        selector: ${metadata.podSelectors}
        type: ClusterIP
  - forEach: ${workload.endpoints.transformMap(name, ep, "external" in ep.visibility
      && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
    id: httproute-external
    targetPlane: dataplane
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key,
          "openchoreo.dev/endpoint-visibility": "external"})}'
        name: '${oc_generate_name(metadata.releaseLineName == "" ? metadata.componentName
          : metadata.componentLineName, endpoint.key)}'
        namespace: ${metadata.namespace}
      spec:
        hostnames: |
          ${[gateway.ingress.external.?http, gateway.ingress.external.?https]
            .filter(g, g.hasValue()).map(g, g.value().host).distinct()
            .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
        parentRefs:
        - name: ${gateway.ingress.external.name}
          namespace: ${gateway.ingress.external.namespace}
        rules:
        - backendRefs:
          - name: '${metadata.releaseLineName == "" ? metadata.componentName : metadata.componentLineName}'
            port: ${endpoint.value.port}
          filters:
          - type: URLRewrite
            urlRewrite:
              path:
                replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                type: ReplacePrefixMatch
          - cors:
              allowCredentials: false
              allowHeaders:
              - '*'
              allowMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
              - HEAD
              allowOrigins:
              - '*'
              exposeHeaders:
              - '*'
            type: CORS
          matches:
          - path:
              type: PathPrefix
              value: '/${metadata.releaseLineName == "" ? metadata.componentName :
                metadata.componentLineName}-${endpoint.key}'
    var: endpoint
  - forEach: ${workload.endpoints.transformMap(name, ep, "internal" in ep.visibility
      && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
    id: httproute-internal
    targetPlane: dataplane
    template:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key,
          "openchoreo.dev/endpoint-visibility": "internal"})}'
        name: '${oc_generate_name(metadata.releaseLineName == "" ? metadata.componentName
          : metadata.componentLineName, endpoint.key, "internal")}'
        namespace: ${metadata.namespace}
      spec:
        hostnames: |
          ${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]
            .filter(g, g.hasValue()).map(g, g.value().host).distinct()
            .map(h, metadata.environmentName + "-" + metadata.componentNamespace + "." + h)}
        parentRefs:
        - name: ${gateway.ingress.internal.name}
          namespace: ${gateway.ingress.internal.namespace}
        rules:
        - backendRefs:
          - name: '${metadata.releaseLineName == "" ? metadata.componentName : metadata.componentLineName}'
            port: ${endpoint.value.port}
          filters:
          - type: URLRewrite
            urlRewrite:
              path:
                replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
                type: ReplacePrefixMatch
          matches:
          - path:
              type: PathPrefix
              value: '/${metadata.releaseLineName == "" ? metadata.componentName :
                metadata.componentLineName}-${endpoint.key}'
    var: endpoint
  - forEach: ${configurations.toConfigEnvsByContainer()}
    id: env-config
    targetPlane: dataplane
    template:
      apiVersion: v1
      data: |
        ${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}
      kind: ConfigMap
      metadata:
        name: ${envConfig.resourceName}
        namespace: ${metadata.namespace}
    var: envConfig
  - forEach: ${configurations.toConfigFileList()}
    id: file-config
    targetPlane: dataplane
    template:
      apiVersion: v1
      data:
        ${config.name}: |
          ${config.value}
      kind: ConfigMap
      metadata:
        name: ${config.resourceName}
        namespace: ${metadata.namespace}
    var: config
  - forEach: ${configurations.toSecretEnvsByContainer()}
    id: secret-env-external
    targetPlane: dataplane
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${secretEnv.resourceName}
        namespace: ${metadata.namespace}
      spec:
        data: |
          ${secretEnv.envs.map(secret, {
            "secretKey": secret.name,
            "remoteRef": {
              "key": secret.remoteRef.key,
              ?"property": secret.remoteRef.?property
            }
          })}
        refreshInterval: 15s
        secretStoreRef:
          kind: ClusterSecretStore
          name: ${dataplane.secretStore}
        target:
          creationPolicy: Owner
          name: ${secretEnv.resourceName}
    var: secretEnv
  - forEach: ${configurations.toSecretFileList()}
    id: secret-file-external
    targetPlane: dataplane
    template:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: ${file.resourceName}
        namespace: ${metadata.namespace}
      spec:
        data:
        - remoteRef:
            key: ${file.remoteRef.key}
            property: |
              ${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}
          secretKey: ${file.name}
        refreshInterval: 15s
        secretStoreRef:
          kind: ClusterSecretStore
          name: ${dataplane.secretStore}
        target:
          creationPolicy: Owner
          name: ${file.resourceName}
    var: file
  validations:
  - message: Service components must have at least one endpoint. Use 'deployment/aep-worker'
      for components without endpoints.
    rule: ${size(workload.endpoints) > 0}
  - message: Endpoints with 'external' visibility require gateway.ingress.external
      to be configured on the Environment or DataPlane.
    rule: |-
      ${workload.endpoints.exists(name, ep, "external" in ep.visibility)
        ? has(gateway.ingress) && has(gateway.ingress.external)
        : true}
  - message: Endpoints with 'internal' visibility require gateway.ingress.internal
      to be configured on the Environment or DataPlane.
    rule: |-
      ${workload.endpoints.exists(name, ep, "internal" in ep.visibility)
        ? has(gateway.ingress) && has(gateway.ingress.internal)
        : true}
  workloadType: deployment
{{- end }}
{{- end }}
