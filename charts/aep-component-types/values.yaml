# Install once on aep-cp after the OpenChoreo CRDs.
types:
  service: true
  worker: true
  cron: true
  migration: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
allowedWorkflows:
  - paketo-buildpacks-builder
  - gcp-buildpacks-builder
  - dockerfile-builder
  - ballerina-buildpack-builder
# Organization namespaces with in-platform builds (charts/aep-builds). Each gets
# namespaced copies of the types that also allow namespacedWorkflows.
buildOrganizations: []
namespacedWorkflows:
  - aep-kaniko-builder
# Environment pull secrets by default: the operator-delivered organization
# registry pull credential (spec.policy.registryPullSecretRef). A missing
# Secret only produces kubelet warnings for public images.
imagePullSecrets:
  - aep-registry-pull
