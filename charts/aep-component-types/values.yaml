# Install once on aep-cp after the OpenChoreo CRDs.
types:
  service: true
  worker: true
  cron: true
  migration: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
allowedWorkflows:
  - paketo-buildpacks-builder
  - gcp-buildpacks-builder
  - dockerfile-builder
  - ballerina-buildpack-builder
