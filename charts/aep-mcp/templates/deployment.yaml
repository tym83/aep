{{- if .Values.mcp.enabled }}
{{- if .Values.tls.terminationProxy }}
{{- if or (not .Values.ingress.enabled) (empty .Values.ingress.tls) }}{{ fail "tls.terminationProxy requires ingress.enabled and ingress.tls" }}{{ end }}
{{- if or .Values.tls.existingSecret .Values.tls.issuerRef.name }}{{ fail "tls.terminationProxy cannot be combined with backend TLS" }}{{ end }}
{{- else }}
{{- if and .Values.tls.existingSecret .Values.tls.issuerRef.name }}{{ fail "set only one of tls.existingSecret or tls.issuerRef.name" }}{{ end }}
{{- if not (or .Values.tls.existingSecret .Values.tls.issuerRef.name) }}{{ fail "tls.existingSecret or tls.issuerRef.name is required" }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: aep-system
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: cozystack-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: cozystack-mcp}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cozystack-mcp
          image: {{ include "aep.mirror" (dict "root" . "ref" (include "aep.ownImage" (dict "root" . "image" .Values.image))) | quote }}
          args:
            - --listen=:8443
            - {{ printf "--issuer=%s" (required "oidc.issuer is required" .Values.oidc.issuer) | quote }}
            - {{ printf "--audience=%s" (required "oidc.audience is required" .Values.oidc.audience) | quote }}
            {{- with .Values.oidc.jwksUrl }}
            - {{ printf "--jwks-url=%s" . | quote }}
            {{- end }}
            - --max-rows={{ int .Values.maxRows }}
            - --max-bytes={{ int .Values.maxBytes }}
            - --requests-per-minute={{ int .Values.requestsPerMinute }}
            {{- with .Values.metricsQueryUrlTemplate }}
            - {{ printf "--metrics-query-url-template=%s" . | quote }}
            {{- end }}
            {{- range .Values.redactPatterns }}
            - {{ printf "--redact-pattern=%s" . | quote }}
            {{- end }}
            {{- if .Values.tls.terminationProxy }}
            - --tls-termination-proxy
            {{- else }}
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            {{- end }}
          ports: [{name: mcp, containerPort: 8443}]
          readinessProbe: {tcpSocket: {port: mcp}}
          livenessProbe: {tcpSocket: {port: mcp}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- if not .Values.tls.terminationProxy }}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
          {{- end }}
      {{- if not .Values.tls.terminationProxy }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret | default (printf "%s-tls" .Release.Name) | quote }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: aep-system
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: cozystack-mcp}
  ports: [{name: mcp, port: 8443, targetPort: mcp}]
{{- end }}
