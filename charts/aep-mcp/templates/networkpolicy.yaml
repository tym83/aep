{{- if .Values.mcp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: aep-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: cozystack-mcp}
  policyTypes: [Ingress]
  {{- if or .Values.organizations .Values.ingress.enabled }}
  ingress:
    - from:
        {{- range .Values.organizations }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aep-{{ .name }}
          podSelector:
            matchLabels: {{ toYaml (required "networkPolicy.agentLabels is required" $.Values.networkPolicy.agentLabels) | nindent 14 }}
        {{- end }}
        {{- if .Values.ingress.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.ingressControllerNamespace is required" .Values.networkPolicy.ingressControllerNamespace | quote }}
        {{- end }}
      ports: [{protocol: TCP, port: 8443}]
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
