image:
  repository: ghcr.io/tym83/aep-cp-backup
  tag: ""
  digest: ""
schedule: "*/10 * * * *"
suspend: false
aepcpKubeconfigSecret: aep-cp-backup-kubeconfig
s3CredentialsSecret: aep-cp-backup-s3
s3Endpoint: ""
s3Bucket: ""
s3Prefix: aep-cp
# Empty = discover management Organizations. Explicit list supports isolated tests.
organizations: []
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
nodeSelector: {}
tolerations: []

# Required public age X25519 recipient. Keep the private identity offline.
ageRecipient: ""

# Mirror prefix; upstream registry hosts are retained as path components.
global:
  aepVersion: ""
  aepDigests: {}
  imageRegistry: ""
