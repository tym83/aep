{{- if .Values.etcd.enabled }}
{{- $e := .Values.etcd }}
{{- $cluster := required "etcd.cluster is required (Kamaji TenantControlPlane name, e.g. kubernetes-aepcp)" $e.cluster }}
# UID-preserving backup: the raw keys of the aep-cp prefix, read with the
# tenant's own Kamaji etcd user. It runs in the aep-cp tenant namespace, where
# the datastore credentials live and etcd ingress is allowed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-etcd
  namespace: {{ required "etcd.namespace is required" $e.namespace }}
spec:
  schedule: {{ $e.schedule | default .Values.schedule | quote }}
  timeZone: Etc/UTC
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}-etcd
            policy.cozystack.io/allow-to-etcd: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          nodeSelector: {{ .Values.nodeSelector | toJson }}
          tolerations: {{ .Values.tolerations | toJson }}
          {{- with ($.Values.global | default dict).imagePullSecrets }}
          imagePullSecrets: {{ toJson . }}
          {{- end }}
          containers:
            - name: backup
              image: {{ include "aep.mirror" (dict "root" . "ref" (include "aep.ownImage" (dict "root" . "image" .Values.image))) | quote }}
              env:
                - name: DB_SCHEMA
                  valueFrom: {secretKeyRef: {name: {{ $cluster }}-datastore-config, key: DB_SCHEMA}}
              args:
                - --etcd-endpoints={{ join "," $e.endpoints }}
                - --etcd-ca=/etcd/ca.crt
                - --etcd-cert=/etcd/server.crt
                - --etcd-key=/etcd/server.key
                - --etcd-prefix=/$(DB_SCHEMA)
                - --s3-endpoint={{ .Values.s3Endpoint }}
                - --s3-bucket={{ .Values.s3Bucket }}
                - --s3-prefix={{ .Values.s3Prefix }}
                - --age-recipient={{ .Values.ageRecipient }}
                - --timeout=8m
                - etcd-backup
              envFrom:
                - secretRef: {name: {{ $e.s3CredentialsSecret | default .Values.s3CredentialsSecret }}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources: {{ .Values.resources | toJson }}
              volumeMounts:
                - {name: etcd, mountPath: /etcd, readOnly: true}
          volumes:
            - name: etcd
              secret: {secretName: {{ $cluster }}-datastore-certificate, defaultMode: 288}
{{- end }}
