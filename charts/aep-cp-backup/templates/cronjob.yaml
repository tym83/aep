{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.image) }}{{ fail "image must be pinned by digest" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
rules:
  - apiGroups: [aep.aenix.io]
    resources: [organizations]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Namespace }}-{{ .Release.Name }}}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: Etc/UTC
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            policy.cozystack.io/allow-to-apiserver: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          nodeSelector: {{ .Values.nodeSelector | toJson }}
          tolerations: {{ .Values.tolerations | toJson }}
          containers:
            - name: backup
              image: {{ include "aep.mirror" (dict "root" . "ref" .Values.image) | quote }}
              args:
                - --aepcp-kubeconfig=/cp/config
                - --organizations={{ join "," .Values.organizations }}
                - --s3-endpoint={{ .Values.s3Endpoint }}
                - --s3-bucket={{ .Values.s3Bucket }}
                - --s3-prefix={{ .Values.s3Prefix }}
                - --age-recipient={{ .Values.ageRecipient }}
                - --timeout=8m
                - backup
              envFrom:
                - secretRef: {name: {{ .Values.s3CredentialsSecret }}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources: {{ .Values.resources | toJson }}
              volumeMounts:
                - {name: cp, mountPath: /cp, readOnly: true}
          volumes:
            - name: cp
              secret: {secretName: {{ .Values.aepcpKubeconfigSecret }}, defaultMode: 288}
