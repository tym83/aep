image:
  repository: ghcr.io/tym83/aep-operator
  tag: ""
  digest: ""
bridgeImage:
  repository: ghcr.io/tym83/aep-bridge
  tag: ""
  digest: ""
# Legacy aep-cp access: management namespace/name Secret, key super-admin.svc.
# Required unless controlPlane.default is set.
aepcpKubeconfigSecret: ""
aepcpTenantNamespace: tenant-aep-cp
aepcpCluster: aepcp
controlPlane:
  # Name of the ControlPlane resource serving Organizations without
  # spec.controlPlaneRef when aepcpKubeconfigSecret is empty. With both set,
  # unreferenced Organizations stay on the legacy aep-cp.
  default: ""
gatewayHostTemplate: 'cluster-gateway.{{.DashedIP}}.nip.io'
tenantEgressWorkaround: true
pruneBootstrapBindings: true
bootstrapBindingSystemClients: openchoreo-backstage-client,openchoreo-observer-resource-reader-client,openchoreo-rca-agent,openchoreo-finops-agent
# url and realm form the OIDC issuer for tenant Argo CD even when enabled is
# false; enabled additionally lets the operator manage realm groups.
keycloak:
  enabled: false
  url: ""
  realm: ""
  credentialsSecret: ""

policyBundleRepository: oci://ghcr.io/tym83/aep/policies
kyvernoChartURL: oci://ghcr.io/kyverno/charts/kyverno
restoreVerification: false

argocdHostTemplate: ""
# ACME directory (for example https://acme-v02.api.letsencrypt.org/directory)
# for the Argo CD host certificate, issued by cert-manager in the nonprod tier
# cluster over HTTP-01. Empty keeps the ingress default certificate.
argocdAcmeServer: ""
vcsWebhookURL: ""

# Mirror the pinned Argo CD chart for disconnected installations.
argocdChartURL: https://argoproj.github.io/argo-helm
# Mirror prefix; upstream registry hosts are retained as path components.
global:
  aepVersion: ""
  aepDigests: {}
  imageRegistry: ""
  # Secrets to pull AEP images from a private registry mirror.
  imagePullSecrets: []
registrySecret: ""
registryCASecret: ""

registryInsecure: false
fleet:
  enabled: false
  gatewayURL: ''
  # Read-only PVC populated with fleet-stage.sh. Never mounted in external clusters.
  chartsPVC: ''
  # Optional dedicated aep-fleet hub config Secret, key config. Empty uses management.
  hubConfigSecret: ''
