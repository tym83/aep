{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "organizations.aep.aenix.io"
  },
  "spec": {
    "group": "aep.aenix.io",
    "scope": "Cluster",
    "names": {
      "plural": "organizations",
      "singular": "organization",
      "kind": "Organization",
      "shortNames": [
        "org"
      ]
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "properties": {
              "apiVersion": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "required": [
                  "displayName",
                  "profile",
                  "quotas",
                  "environments",
                  "tiers"
                ],
                "properties": {
                  "displayName": {
                    "type": "string"
                  },
                  "profile": {
                    "type": "string",
                    "enum": [
                      "small",
                      "standard",
                      "regulated"
                    ],
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "profile is immutable; migrate explicitly"
                      }
                    ]
                  },
                  "costCenter": {
                    "type": "string"
                  },
                  "quotas": {
                    "type": "object",
                    "required": [
                      "cpu",
                      "memory"
                    ],
                    "properties": {
                      "cpu": {
                        "type": "string"
                      },
                      "memory": {
                        "type": "string"
                      },
                      "storage": {
                        "type": "string"
                      },
                      "gpu": {
                        "type": "string"
                      }
                    }
                  },
                  "environments": {
                    "type": "array",
                    "minItems": 1,
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "name"
                    ],
                    "items": {
                      "type": "object",
                      "required": [
                        "name",
                        "tier",
                        "changeModel"
                      ],
                      "properties": {
                        "name": {
                          "type": "string",
                          "maxLength": 63,
                          "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        },
                        "tier": {
                          "type": "string",
                          "enum": [
                            "nonprod",
                            "prod"
                          ]
                        },
                        "changeModel": {
                          "type": "string",
                          "enum": [
                            "none",
                            "required"
                          ]
                        },
                        "dataPlane": {
                          "type": "object",
                          "required": [
                            "external"
                          ],
                          "properties": {
                            "external": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 40,
                              "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                            }
                          }
                        }
                      }
                    },
                    "maxItems": 64
                  },
                  "tiers": {
                    "type": "object",
                    "required": [
                      "nonprod"
                    ],
                    "properties": {
                      "nonprod": {
                        "type": "object",
                        "required": [
                          "cluster",
                          "services"
                        ],
                        "properties": {
                          "cluster": {
                            "type": "object",
                            "required": [
                              "version",
                              "nodeGroups"
                            ],
                            "properties": {
                              "version": {
                                "type": "string"
                              },
                              "nodeGroups": {
                                "type": "object",
                                "required": [
                                  "md0"
                                ],
                                "properties": {
                                  "md0": {
                                    "type": "object",
                                    "required": [
                                      "minReplicas",
                                      "maxReplicas",
                                      "instanceType"
                                    ],
                                    "properties": {
                                      "minReplicas": {
                                        "type": "integer",
                                        "minimum": 1
                                      },
                                      "maxReplicas": {
                                        "type": "integer",
                                        "minimum": 1
                                      },
                                      "instanceType": {
                                        "type": "string"
                                      }
                                    },
                                    "x-kubernetes-validations": [
                                      {
                                        "rule": "self.maxReplicas >= self.minReplicas",
                                        "message": "maxReplicas must be at least minReplicas"
                                      }
                                    ]
                                  }
                                }
                              }
                            }
                          },
                          "services": {
                            "type": "object",
                            "required": [
                              "allowedKinds"
                            ],
                            "properties": {
                              "allowedKinds": {
                                "type": "array",
                                "items": {
                                  "type": "string",
                                  "enum": [
                                    "Postgres",
                                    "Redis"
                                  ]
                                },
                                "x-kubernetes-list-type": "set"
                              },
                              "maxPreset": {
                                "type": "string"
                              },
                              "backupPolicy": {
                                "type": "string"
                              }
                            }
                          },
                          "argocd": {
                            "type": "object",
                            "required": [
                              "enabled"
                            ],
                            "properties": {
                              "enabled": {
                                "type": "boolean"
                              },
                              "version": {
                                "type": "string",
                                "enum": [
                                  "9.7.1"
                                ]
                              }
                            }
                          }
                        }
                      },
                      "prod": {
                        "type": "object",
                        "required": [
                          "cluster",
                          "services"
                        ],
                        "properties": {
                          "cluster": {
                            "type": "object",
                            "required": [
                              "version",
                              "nodeGroups"
                            ],
                            "properties": {
                              "version": {
                                "type": "string"
                              },
                              "nodeGroups": {
                                "type": "object",
                                "required": [
                                  "md0"
                                ],
                                "properties": {
                                  "md0": {
                                    "type": "object",
                                    "required": [
                                      "minReplicas",
                                      "maxReplicas",
                                      "instanceType"
                                    ],
                                    "properties": {
                                      "minReplicas": {
                                        "type": "integer",
                                        "minimum": 1
                                      },
                                      "maxReplicas": {
                                        "type": "integer",
                                        "minimum": 1
                                      },
                                      "instanceType": {
                                        "type": "string"
                                      }
                                    },
                                    "x-kubernetes-validations": [
                                      {
                                        "rule": "self.maxReplicas >= self.minReplicas",
                                        "message": "maxReplicas must be at least minReplicas"
                                      }
                                    ]
                                  }
                                }
                              }
                            }
                          },
                          "services": {
                            "type": "object",
                            "required": [
                              "allowedKinds"
                            ],
                            "properties": {
                              "allowedKinds": {
                                "type": "array",
                                "items": {
                                  "type": "string",
                                  "enum": [
                                    "Postgres",
                                    "Redis"
                                  ]
                                },
                                "x-kubernetes-list-type": "set"
                              },
                              "maxPreset": {
                                "type": "string"
                              },
                              "backupPolicy": {
                                "type": "string"
                              }
                            }
                          },
                          "argocd": {
                            "type": "object",
                            "required": [
                              "enabled"
                            ],
                            "properties": {
                              "enabled": {
                                "type": "boolean"
                              },
                              "version": {
                                "type": "string",
                                "enum": [
                                  "9.7.1"
                                ]
                              }
                            }
                          }
                        },
                        "x-kubernetes-validations": [
                          {
                            "rule": "!has(self.argocd)",
                            "message": "Argo CD is supported only in nonprod; use OpenChoreo promotion for prod"
                          }
                        ]
                      }
                    }
                  },
                  "access": {
                    "type": "object",
                    "properties": {
                      "developer": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "x-kubernetes-list-type": "atomic"
                      },
                      "platform": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "x-kubernetes-list-type": "atomic"
                      },
                      "approver": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "x-kubernetes-list-type": "atomic"
                      },
                      "admin": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "x-kubernetes-list-type": "atomic"
                      },
                      "auditor": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "x-kubernetes-list-type": "atomic"
                      },
                      "finance": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        },
                        "x-kubernetes-list-type": "atomic"
                      }
                    }
                  },
                  "policy": {
                    "type": "object",
                    "properties": {
                      "mode": {
                        "type": "string",
                        "enum": [
                          "audit",
                          "enforce"
                        ],
                        "default": "audit"
                      },
                      "cosignPublicKey": {
                        "type": "string",
                        "maxLength": 16384
                      },
                      "registries": {
                        "type": "array",
                        "x-kubernetes-list-type": "set",
                        "maxItems": 100,
                        "items": {
                          "type": "string",
                          "pattern": "^[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?$"
                        }
                      },
                      "platformNamespaces": {
                        "type": "array",
                        "maxItems": 100,
                        "x-kubernetes-list-type": "set",
                        "items": {
                          "type": "string",
                          "maxLength": 63,
                          "pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$",
                          "x-kubernetes-validations": [
                            {
                              "rule": "!self.startsWith('dp-')",
                              "message": "Application cell namespaces cannot be platform namespaces"
                            }
                          ]
                        }
                      },
                      "platformImageTrust": {
                        "type": "object",
                        "properties": {
                          "mode": {
                            "type": "string",
                            "enum": [
                              "audit",
                              "enforce"
                            ],
                            "default": "audit"
                          },
                          "vendorPublicKeys": {
                            "type": "array",
                            "maxItems": 100,
                            "items": {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 16384
                            },
                            "x-kubernetes-list-type": "atomic"
                          },
                          "allowedImages": {
                            "type": "array",
                            "maxItems": 100,
                            "items": {
                              "type": "string",
                              "pattern": "^[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?/[a-z0-9._/-]+(:[a-zA-Z0-9_][a-zA-Z0-9_.-]*)?@sha256:[a-f0-9]{64}$"
                            },
                            "x-kubernetes-list-type": "atomic"
                          }
                        }
                      }
                    }
                  },
                  "vcs": {
                    "type": "object",
                    "required": [
                      "provider",
                      "url",
                      "credentialsSecretRef",
                      "readCredentialsSecretRef"
                    ],
                    "properties": {
                      "provider": {
                        "type": "string",
                        "enum": [
                          "gitlab",
                          "github",
                          "gitea"
                        ]
                      },
                      "url": {
                        "type": "string",
                        "pattern": "^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$"
                      },
                      "groupPath": {
                        "type": "string",
                        "pattern": "^[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$"
                      },
                      "org": {
                        "type": "string",
                        "pattern": "^[a-zA-Z0-9_-]+$"
                      },
                      "ensureGroup": {
                        "type": "boolean"
                      },
                      "credentialsSecretRef": {
                        "type": "object",
                        "required": [
                          "name"
                        ],
                        "properties": {
                          "name": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 253,
                            "pattern": "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                          }
                        }
                      },
                      "readCredentialsSecretRef": {
                        "type": "object",
                        "required": [
                          "name"
                        ],
                        "properties": {
                          "name": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 253,
                            "pattern": "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                          }
                        }
                      },
                      "caBundleSecretRef": {
                        "type": "object",
                        "required": [
                          "name"
                        ],
                        "properties": {
                          "name": {
                            "type": "string",
                            "minLength": 1,
                            "maxLength": 253,
                            "pattern": "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                          }
                        }
                      }
                    },
                    "x-kubernetes-validations": [
                      {
                        "rule": "self.readCredentialsSecretRef.name != self.credentialsSecretRef.name",
                        "message": "Read and admin credentials must use separate Secrets"
                      },
                      {
                        "rule": "self.provider == 'gitlab' ? has(self.groupPath) && !has(self.org) : has(self.org) && !has(self.groupPath)",
                        "message": "Use groupPath for GitLab and org for GitHub/Gitea"
                      },
                      {
                        "rule": "!has(self.ensureGroup) || !self.ensureGroup || self.provider == 'gitlab'",
                        "message": "Only GitLab supports group creation"
                      }
                    ]
                  }
                },
                "x-kubernetes-validations": [
                  {
                    "rule": "oldSelf.environments.all(o, !has(o.dataPlane) || self.environments.exists(e, e.name == o.name && e.tier == o.tier && has(e.dataPlane) && e.dataPlane == o.dataPlane))",
                    "message": "External environments cannot be removed or change tier or assignment; create a new environment"
                  },
                  {
                    "rule": "self.environments.all(e, oldSelf.environments.all(o, o.name != e.name || has(o.dataPlane) == has(e.dataPlane)))",
                    "message": "Environment DataPlane selection is immutable; create a new environment"
                  }
                ]
              },
              "status": {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string"
                  },
                  "deletionStarted": {
                    "type": "boolean"
                  },
                  "conditions": {
                    "type": "array",
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "type"
                    ],
                    "items": {
                      "type": "object",
                      "required": [
                        "type",
                        "status",
                        "reason",
                        "message",
                        "lastTransitionTime"
                      ],
                      "properties": {
                        "type": {
                          "type": "string"
                        },
                        "reason": {
                          "type": "string"
                        },
                        "message": {
                          "type": "string"
                        },
                        "status": {
                          "type": "string",
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ]
                        },
                        "lastTransitionTime": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "observedGeneration": {
                          "type": "integer",
                          "format": "int64"
                        }
                      }
                    }
                  },
                  "controlPlaneReadySince": {
                    "type": "object",
                    "additionalProperties": {
                      "type": "string",
                      "format": "date-time"
                    }
                  },
                  "remediations": {
                    "type": "array",
                    "maxItems": 50,
                    "items": {
                      "type": "object",
                      "required": [
                        "time",
                        "namespace",
                        "release",
                        "reason"
                      ],
                      "properties": {
                        "time": {
                          "type": "string",
                          "format": "date-time"
                        },
                        "namespace": {
                          "type": "string"
                        },
                        "release": {
                          "type": "string"
                        },
                        "reason": {
                          "type": "string"
                        }
                      }
                    },
                    "x-kubernetes-list-type": "atomic"
                  },
                  "argocdURL": {
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "subresources": {
          "status": {}
        },
        "additionalPrinterColumns": [
          {
            "name": "Phase",
            "type": "string",
            "jsonPath": ".status.phase"
          }
        ]
      }
    ]
  }
}
