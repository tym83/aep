apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-operator
spec:
  replicas: 1
  selector:
    matchLabels: {app: aep-operator}
  template:
    metadata:
      labels: {app: aep-operator}
    spec:
      serviceAccountName: aep-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: {{ include "aep.mirror" (dict "root" . "ref" (include "aep.ownImage" (dict "root" . "image" .Values.image))) | quote }}
          args:
            {{- if .Values.global.imageRegistry }}
            - {{ printf "--argocd-chart-url=%s" (include "aep.mirror" (dict "root" . "ref" "oci://argoproj.github.io/argo-helm/argo-cd")) | quote }}
            {{- else }}
            - {{ printf "--argocd-chart-url=%s" .Values.argocdChartURL | quote }}
            {{- end }}
            - {{ printf "--argocd-host-template=%s" .Values.argocdHostTemplate | quote }}
            - {{ printf "--vcs-webhook-url=%s" .Values.vcsWebhookURL | quote }}
            - {{ printf "--registry-insecure=%t" .Values.registryInsecure | quote }}
            - {{ printf "--image-registry-mirror=%s" .Values.global.imageRegistry | quote }}
            - {{ printf "--chart-registry-mirror=%s" .Values.global.imageRegistry | quote }}
            - {{ printf "--registry-secret=%s" .Values.registrySecret | quote }}
            - {{ printf "--registry-ca-secret=%s" .Values.registryCASecret | quote }}
            - {{ printf "--policy-bundle-repository=%s" (include "aep.mirror" (dict "root" . "ref" .Values.policyBundleRepository)) | quote }}
            - {{ printf "--kyverno-chart-url=%s" (include "aep.mirror" (dict "root" . "ref" .Values.kyvernoChartURL)) | quote }}
            - {{ printf "--restore-verification=%t" .Values.restoreVerification | quote }}
            - {{ printf "--namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--bridge-image=%s" (include "aep.mirror" (dict "root" . "ref" (include "aep.ownImage" (dict "root" . "image" .Values.bridgeImage)))) | quote }}
            - {{ printf "--aepcp-kubeconfig-secret=%s" (required "aepcpKubeconfigSecret required" .Values.aepcpKubeconfigSecret) | quote }}
            - {{ printf "--aepcp-tenant-namespace=%s" .Values.aepcpTenantNamespace | quote }}
            - {{ printf "--aepcp-cluster=%s" .Values.aepcpCluster | quote }}
            - {{ printf "--gateway-host-template=%s" .Values.gatewayHostTemplate | quote }}
            - {{ printf "--tenant-egress-workaround=%t" .Values.tenantEgressWorkaround | quote }}
            - {{ printf "--prune-bootstrap-bindings=%t" .Values.pruneBootstrapBindings | quote }}
            - {{ printf "--bootstrap-binding-system-clients=%s" .Values.bootstrapBindingSystemClients | quote }}
            - {{ printf "--keycloak-enabled=%t" .Values.keycloak.enabled | quote }}
            {{- if .Values.keycloak.enabled }}
            - {{ printf "--keycloak-url=%s" .Values.keycloak.url | quote }}
            - {{ printf "--keycloak-realm=%s" .Values.keycloak.realm | quote }}
            - {{ printf "--keycloak-credentials-secret=%s" .Values.keycloak.credentialsSecret | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
