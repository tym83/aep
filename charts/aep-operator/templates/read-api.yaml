{{- if .Values.readApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-read-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aep-read-api
rules:
  - apiGroups: [aep.aenix.io]
    resources: [organizations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-read-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-read-api
subjects:
  - kind: ServiceAccount
    name: aep-read-api
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-read-api
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-read-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aep-read-api
subjects:
  - kind: ServiceAccount
    name: aep-read-api
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-read-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: aep-read-api}
  template:
    metadata:
      labels: {app: aep-read-api}
    spec:
      serviceAccountName: aep-read-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: read-api
          image: {{ required "readApi.image required" .Values.readApi.image | quote }}
          args:
            - {{ printf "--namespace=%s" .Release.Namespace | quote }}
            - {{ printf "--issuer=%s" (required "readApi.issuer required" .Values.readApi.issuer) | quote }}
            - {{ printf "--audience=%s" (required "readApi.audience required" .Values.readApi.audience) | quote }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aep-read-api
spec:
  selector: {app: aep-read-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
