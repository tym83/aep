apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aep-operator
rules:
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests]
    verbs: [get, list]
  - apiGroups: [certificates.k8s.io]
    resources: [certificatesigningrequests/approval]
    verbs: [update]
  - apiGroups: [certificates.k8s.io]
    resources: [signers]
    resourceNames: [kubernetes.io/kube-apiserver-client]
    verbs: [approve]
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclusters, managedclustersets, managedclustersetbindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclusters/accept, managedclustersets/join, managedclustersets/bind]
    verbs: [create, update]
  - apiGroups: [work.open-cluster-management.io]
    resources: [manifestworks]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [clusterprofiles]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch]
  - apiGroups: [backups.cozystack.io]
    resources: [backupclasses, restorejobs]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [strategy.backups.cozystack.io]
    resources: [cnpgs]
    verbs: [get, list, create, patch]
  - apiGroups: [aep.aenix.io]
    resources: [organizations, organizations/status, organizations/finalizers, externalclusters, externalclusters/status, externalclusters/finalizers, changerequests]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [apps.cozystack.io]
    resources: [tenants, kuberneteses, kubernetesnodeses]
    verbs: [get, list, watch, create, update, patch, delete]
  # These rights are also delegated to namespace-scoped bridge Roles.
  - apiGroups: [apps.cozystack.io]
    resources: [postgreses, redises]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [core.cozystack.io]
    resources: [tenantsecrets]
    verbs: [get, list, watch]
  - apiGroups: [backups.cozystack.io]
    resources: [plans]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [backups.cozystack.io]
    resources: [backups]
    verbs: [get, list]
  - apiGroups: [kamaji.clastix.io]
    resources: [tenantcontrolplanes]
    verbs: [get, list, watch]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories, helmrepositories]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumclusterwidenetworkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets, configmaps, serviceaccounts]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-operator
subjects:
  - kind: ServiceAccount
    name: aep-operator
    namespace: {{ .Release.Namespace }}
