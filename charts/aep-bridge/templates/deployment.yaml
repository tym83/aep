apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ toJson .Values.policy | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bridge
          image: {{ include "aep.mirror" (dict "root" . "ref" (printf "%s:%s" .Values.image.repository .Values.image.tag)) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --organization={{ required "organization is required" .Values.organization }}
            - --tier={{ .Values.tier }}
            - --tenant-namespace={{ .Release.Namespace }}
            - --cluster-id={{ required "clusterID is required" .Values.clusterID }}
            - --allowed-kinds={{ join "," .Values.allowedKinds }}
            - --tier-deletion-policy={{ .Values.tierDeletionPolicy }}
            - --app-kubeconfig=/app-credentials/kubeconfig
            - --app-token-file=/app-credentials/token
            - --config=/config/policy.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: health, containerPort: 8081}]
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: app-credentials, mountPath: /app-credentials, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: app-credentials
          secret:
            secretName: {{ .Values.appCredentialsSecret }}
            defaultMode: 0440
        - name: config
          configMap: {name: {{ .Release.Name }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  policy.yaml: |
    {{- toYaml .Values.policy | nindent 4 }}
