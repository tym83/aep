organization: ""
tier: nonprod
clusterID: ""
# Install into the tier tenant namespace; all management permissions stay there.
image:
  repository: ghcr.io/tym83/aep-bridge
  tag: "sha-618d4f85c1e90f6afcaf3cbcb26a066f21155e83@sha256:3b1f6ba35e7d43e7ff3df5f18f797c5dc52aea370bba1dda2c2acfbc5bfe7414"
  pullPolicy: IfNotPresent
replicas: 1
allowedKinds: [Postgres, Redis]
tierDeletionPolicy: Retain
# Existing Secret with keys kubeconfig and token. kubeconfig must reference tokenFile.
appCredentialsSecret: aep-bridge-app-credentials
prodAdmissionDraft: false
policy:
  kinds:
    Postgres:
      allowedParameters: [version, databases, users, resourcesPreset, size, replicas]
      maxPreset: u1.large
      maxSize: 100Gi
      maxReplicas: 3
    Redis:
      allowedParameters: [version, resourcesPreset, size, replicas]
      maxPreset: u1.large
      maxSize: 100Gi
      maxReplicas: 3
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

# Mirror prefix; upstream registry hosts are retained as path components.
global:
  imageRegistry: ""
