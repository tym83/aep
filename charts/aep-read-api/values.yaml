image:
  repository: ghcr.io/tym83/aep-read-api
  tag: ""
  digest: ""
replicas: 1
oidc:
  issuer: ""
  jwksUrl: ""
  audience: ""
  usernameClaim: preferred_username
  groupsClaim: groups
# Namespace where the operator collector stores compliance snapshots.
complianceNamespace: aep-system
orgNamespaceTemplate: tenant-{org}
# Example: https://console.example.org/{{.Namespace}}/{{.Kind}}/{{.Name}}
consoleUrlTemplate: ""
# OpenChoreo API URL for environment-scoped log access (logs:view per
# environment, evaluated with the caller's token). Empty disables the route.
# Also deny direct access to .../k8sresources/logs on the OpenChoreo API
# entry point: OpenChoreo authorizes it with releasebinding:view only.
openchoreoUrl: ""
# Host header when openchoreoUrl is an internal gateway address. The public
# entry denies the direct log route, so point openchoreoUrl past it, for
# example at the gateway Service, and set the public API host here.
openchoreoHost: ""
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

# Existing Secret containing COST_DSN for a SELECT-only ledger role.
costCredentialsSecret: ""

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  clusterIssuer: ""
  annotations: {}

# Mirror prefix; upstream registry hosts are retained as path components.
global:
  aepVersion: ""
  aepDigests: {}
  imageRegistry: ""
  # Secrets to pull AEP images from a private registry mirror.
  imagePullSecrets: []
