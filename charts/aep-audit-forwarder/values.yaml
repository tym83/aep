image:
  repository: ghcr.io/tym83/aep-audit-forwarder
  tag: ""
  digest: ""
stream: management
tlsSecret: aep-audit-tls
tokenSecret: aep-audit-token
sinkCredentialsSecret: aep-audit-sinks
spoolBytes: 67108864
storage: 1Gi
storageClassName: ""
opensearchURL: ""
opensearchIndex: aep-audit
syslogAddress: ""
s3Endpoint: ""
s3Bucket: ""
s3Prefix: audit
# Collect OpenChoreo API audit records (msg "AUDIT-LOG", enabled with the
# OpenChoreo control-plane value openchoreoApi.config.audit.enabled) from the
# API pod logs. kubeconfigSecret holds key "kubeconfig" for an identity on the
# OpenChoreo control-plane cluster limited to get/list pods and get pods/log in
# namespace. Empty disables collection.
openchoreoAudit:
  kubeconfigSecret: ""
  namespace: openchoreo-control-plane
  selector: app.kubernetes.io/component=api-server
  container: api-server
  source: openchoreo
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
nodeSelector: {}
tolerations: []

# Mirror prefix; upstream registry hosts are retained as path components.
global:
  aepVersion: ""
  aepDigests: {}
  imageRegistry: ""
  # Secrets to pull AEP images from a private registry mirror.
  imagePullSecrets: []
