apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.bridgeNamespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.bridgeServiceAccount }}
  namespace: {{ .Values.bridgeNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.bridgeServiceAccount }}
rules:
  - apiGroups: [aep.aenix.io]
    resources: [serviceclaims, serviceclaims/status, serviceclaims/finalizers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, create, patch, update]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.bridgeServiceAccount }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.bridgeServiceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.bridgeServiceAccount }}
    namespace: {{ .Values.bridgeNamespace }}
---
# Kafka claims are Strimzi resources in this namespace only; Strimzi writes
# the user and cluster CA Secrets the bridge reads into claim outputs.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.kafkaNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.bridgeServiceAccount }}-kafka
  namespace: {{ .Values.kafkaNamespace }}
rules:
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas, kafkanodepools, kafkatopics, kafkausers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.bridgeServiceAccount }}-kafka
  namespace: {{ .Values.kafkaNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.bridgeServiceAccount }}-kafka
subjects:
  - kind: ServiceAccount
    name: {{ .Values.bridgeServiceAccount }}
    namespace: {{ .Values.bridgeNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-agent
rules:
  - apiGroups: [aep.aenix.io]
    resources: [serviceclaims]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ .Values.agentServiceAccount }}
    namespace: {{ .Values.agentNamespace }}
