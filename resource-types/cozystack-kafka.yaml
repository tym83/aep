apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: cozystack-kafka
  annotations:
    openchoreo.dev/local-dev-addresses: client=outputs.host:outputs.port
spec:
  parameters:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum: ["4.1.1"]
          default: "4.1.1"
        topics:
          type: array
          default: []
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
                maxLength: 100
                pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
              partitions:
                type: integer
                minimum: 1
                maximum: 100
                default: 3
              config:
                type: object
                additionalProperties:
                  type: string
  environmentConfigs:
    openAPIV3Schema:
      type: object
      additionalProperties: false
      properties:
        resourcesPreset:
          type: string
          enum: [t1.nano, t1.micro, t1.small, t1.medium, t1.large, t1.xlarge, t1.2xlarge, t1.4xlarge, c1.nano, c1.micro, c1.small, c1.medium, c1.large, c1.xlarge, c1.2xlarge, c1.4xlarge, s1.nano, s1.micro, s1.small, s1.medium, s1.large, s1.xlarge, s1.2xlarge, s1.4xlarge, u1.nano, u1.micro, u1.small, u1.medium, u1.large, u1.xlarge, u1.2xlarge, u1.4xlarge, m1.nano, m1.micro, m1.small, m1.medium, m1.large, m1.xlarge, m1.2xlarge, m1.4xlarge]
          default: t1.small
        size:
          type: string
          default: 10Gi
        replicas:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
        deletionPolicy:
          type: string
          enum: [Delete, Retain]
          default: Delete
  retainPolicy: Delete
  outputs:
    - name: host
      value: ${applied.claim.status.connection.host}
    - name: port
      value: ${string(applied.claim.status.connection.port)}
    - name: bootstrapServers
      value: ${applied.claim.status.connection.host + ':' + string(applied.claim.status.connection.port)}
    - name: saslMechanism
      value: SCRAM-SHA-512
    - name: username
      value: ${applied.claim.status.connection.username}
    - name: password
      secretKeyRef:
        name: ${metadata.name}-conn
        key: password
    - name: ca.crt
      secretKeyRef:
        name: ${metadata.name}-conn
        key: ca.crt
  resources:
    - id: claim
      readyWhen: "${has(applied.claim.status.conditions) && applied.claim.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}"
      template:
        apiVersion: aep.aenix.io/v1alpha1
        kind: ServiceClaim
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          kind: Kafka
          resource:
            name: ${metadata.resourceName}
            project: ${metadata.projectName}
            environment: ${metadata.environmentName}
          parameters:
            version: ${parameters.version}
            topics: ${parameters.topics}
          environmentParameters:
            resourcesPreset: ${environmentConfigs.resourcesPreset}
            size: ${environmentConfigs.size}
            replicas: ${environmentConfigs.replicas}
          deletionPolicy: ${environmentConfigs.deletionPolicy}
